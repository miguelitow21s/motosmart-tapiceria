<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>La ficha de aplicación</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #FAFAF7; color: #141414; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative; }
  nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid #141414; }
  .logo { width: 84px; height: 40px; border-radius: 4px; background: #000; display: grid; place-items: center; color: #fff; font: italic 900 12px Arial; }
  .logo b { color: #D0021B; }
  .menu { font: 600 14px/1 "Segoe UI", Arial; letter-spacing: 0.04em; }
  .finder { padding: 16px; border-bottom: 1px solid #E4E2DC; }
  .finder h2 { font: 700 22px/1.1 "Segoe UI", Arial; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sel { height: 48px; border: 1.5px solid #141414; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 16px; }
  .sel::after { content: "▾"; font-size: 14px; }
  .count { margin-top: 8px; font-size: 13px; color: #5a5a55; }
  .ficha { margin: 14px 16px 0; border: 1.5px solid #141414; border-radius: 4px; background: #fff; }
  .fhead { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #E4E2DC; font: 600 12px/1 Consolas, "Courier New", monospace; letter-spacing: 0.06em; color: #5a5a55; }
  .ph { height: 252px; position: relative; background: linear-gradient(#5a524a, #2c2925); }
  .ph i { position: absolute; left: 50%; top: 18px; width: 108px; height: 216px; transform: translateX(-50%); border-radius: 52px 52px 34px 34px; background: #161616; }
  .ph i::before { content: ""; position: absolute; inset: 34px 18px; border-radius: 24px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 8px 12px; border-top: 1px solid #E4E2DC; vertical-align: top; }
  td:first-child { width: 96px; color: #5a5a55; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 10px; }
  td b { font-weight: 600; }
  .stamp { position: absolute; right: 26px; top: 452px; transform: rotate(-6deg); border: 3px solid #D0021B; color: #D0021B; border-radius: 6px; padding: 6px 10px; font: 800 24px/1 "Segoe UI", Arial; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.92); }
  .cta { position: absolute; left: 16px; right: 16px; bottom: 24px; height: 54px; border-radius: 4px; background: #D0021B; color: #fff; display: grid; place-items: center; font: 700 18px/1 "Segoe UI", Arial; }
</style>
</head>
<body>
  <nav><div class="logo">Moto<b>Smart</b></div><span class="menu">MENÚ</span></nav>
  <section class="finder">
    <h2>¿Para qué moto?</h2>
    <div class="row"><div class="sel">AKT</div><div class="sel">NKD 125</div></div>
    <p class="count">8 trabajos aplican para tu moto</p>
  </section>
  <article class="ficha">
    <div class="fhead"><span>REF. MS-0142</span><span>1 / 8</span></div>
    <div class="ph"><i></i></div>
    <table>
      <tr><td>Aplica para</td><td><b>AKT NKD 125 · CR4 125</b></td></tr>
      <tr><td>Material</td><td>Cuero sintético, costura diamante roja</td></tr>
    </table>
  </article>
  <div class="stamp">$145.000</div>
  <div class="cta">Cotizar por WhatsApp</div>
</body>
</html>
