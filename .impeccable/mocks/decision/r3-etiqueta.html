<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Etiqueta de confección</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #F4F2EE; color: #121212; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative; }
  nav { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .woven { position: relative; height: 40px; padding: 0 14px; background: #121212; color: #fff; display: flex; align-items: center; font: italic 900 14px Arial; letter-spacing: 0.01em; }
  .woven b { color: #C8102E; }
  .woven::before { content: ""; position: absolute; inset: 4px; border: 1.5px dashed rgba(200,16,46,0.9); }
  .menu { font: 600 15px/1 "Segoe UI", Arial; padding: 12px 0; }
  h1 { padding: 6px 16px 14px; font: 700 27px/1.08 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  h1 em { font-style: italic; color: #C8102E; }
  .photo { position: relative; height: 392px; background: linear-gradient(#615850, #2b2824); }
  .photo i { position: absolute; left: 96px; top: 34px; width: 120px; height: 300px; border-radius: 58px 58px 38px 38px; background: #161616; }
  .photo i::before { content: ""; position: absolute; inset: 42px 22px; border-radius: 28px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .string { position: absolute; right: 74px; top: 300px; width: 2px; height: 66px; background: #d9d4cb; transform-origin: top; }
  .tag { position: absolute; right: 22px; top: 360px; width: 136px; padding: 22px 12px 12px; background: #fff; border-radius: 6px 6px 4px 4px; box-shadow: 0 6px 16px rgba(30,20,10,0.22); clip-path: polygon(22% 0, 78% 0, 100% 14%, 100% 100%, 0 100%, 0 14%); }
  .tag::before { content: ""; position: absolute; left: 50%; top: 8px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #F4F2EE; box-shadow: inset 0 0 0 2px #d9d4cb; }
  .tag small { display: block; font: 600 11px/1.2 "Segoe UI", Arial; letter-spacing: 0.08em; text-transform: uppercase; color: #6a6560; }
  .tag p { font: 600 15px/1.2 "Segoe UI", Arial; margin-top: 4px; }
  .tag strong { display: block; margin-top: 8px; font: 700 24px/1 "Segoe UI", Arial; font-variant-numeric: tabular-nums; }
  .cta { position: absolute; left: 16px; right: 16px; top: 552px; height: 56px; border-radius: 4px; background: #C8102E; color: #fff; display: grid; place-items: center; font: 700 18px/1 "Segoe UI", Arial; }
  .care { position: absolute; left: 16px; right: 16px; bottom: 26px; background: #fff; border: 1px solid #e3ded5; padding: 14px 16px; font: 13px/1.5 "Segoe UI", Arial; color: #3a3632; }
  .care::before { content: ""; position: absolute; inset: 4px; border: 1px dashed #d6cfc4; pointer-events: none; }
  .care b { color: #121212; }
  .brands { position: absolute; left: 16px; right: 16px; top: 624px; display: flex; gap: 8px; overflow: hidden; }
  .brands span { flex: none; height: 40px; padding: 0 14px; border: 1.5px solid #121212; display: inline-flex; align-items: center; font: 600 14px/1 "Segoe UI", Arial; background: #F4F2EE; }
  .brands span.on { background: #121212; color: #fff; }
</style>
</head>
<body>
  <nav><div class="woven">Moto<b>Smart</b></div><span class="menu">Menú</span></nav>
  <h1>Tapicería para tu moto, hecha a mano en <em>Medellín</em></h1>
  <div class="photo"><i></i></div>
  <div class="string"></div>
  <div class="tag"><small>Yamaha</small><p>DT 125 · diamante rojo</p><strong>$145.000</strong></div>
  <div class="cta">Pedir la mía por WhatsApp</div>
  <div class="brands"><span class="on">Yamaha</span><span>AKT</span><span>Honda</span><span>Suzuki</span><span>Kawasaki</span></div>
  <div class="care"><b>Composición</b> · cuerina, costura a mano<br><b>Hecho a mano en Medellín</b> · te cotizamos por WhatsApp</div>
</body>
</html>
