<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>El catálogo apretado</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #ECE9E2; color: #141414; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  header { height: 64px; background: #D0021B; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: #fff; }
  .logo { width: 84px; height: 40px; border-radius: 8px; background: #000; display: grid; place-items: center; font: italic 900 12px Arial; }
  .logo b { color: #D0021B; }
  h1 { font: 900 26px/1 "Arial Rounded MT Bold", "Segoe UI", Arial, sans-serif; }
  .brands { display: flex; gap: 0; background: #141414; }
  .brands span { flex: 1; height: 44px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; border-right: 1px solid #333; }
  .brands span.on { background: #fff; color: #141414; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { height: 238px; position: relative; overflow: hidden; border-right: 2px solid #141414; border-bottom: 2px solid #141414; }
  .cell:nth-child(4n+1), .cell:nth-child(4n+4) { background: #D0021B; }
  .cell:nth-child(4n+2), .cell:nth-child(4n+3) { background: #fff; }
  .seat { position: absolute; left: 50%; top: 14px; width: 84px; height: 168px; transform: translateX(-50%); border-radius: 40px 40px 26px 26px; background: #161616; }
  .seat::before { content: ""; position: absolute; inset: 26px 14px; border-radius: 20px; background: repeating-linear-gradient(45deg, #5b5b5b 0 7px, #3a3a3a 7px 14px); }
  .burst { position: absolute; right: 6px; top: 96px; width: 92px; height: 92px; background: #141414; color: #fff; display: grid; place-items: center; font: 900 22px/1 "Arial Rounded MT Bold", Arial; clip-path: polygon(50% 0, 61% 18%, 82% 10%, 80% 32%, 100% 40%, 85% 56%, 96% 76%, 74% 78%, 68% 100%, 50% 86%, 32% 100%, 26% 78%, 4% 76%, 15% 56%, 0 40%, 20% 32%, 18% 10%, 39% 18%); }
  .code { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; border-top: 2px solid #141414; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
  <header><div class="logo">Moto<b>Smart</b></div><h1>Sillas a mano</h1></header>
  <div class="brands"><span class="on">AKT</span><span>Honda</span><span>Yamaha</span><span>Suzuki</span><span>Más</span></div>
  <div class="grid">
    <div class="cell"><div class="seat"></div><div class="burst">145</div><div class="code">AKT-07 · Cotizar</div></div>
    <div class="cell"><div class="seat"></div><div class="burst">130</div><div class="code">AKT-03</div></div>
    <div class="cell"><div class="seat"></div><div class="burst">160</div><div class="code">AKT-11</div></div>
    <div class="cell"><div class="seat"></div><div class="burst">145</div><div class="code">AKT-02</div></div>
    <div class="cell"><div class="seat"></div><div class="burst">120</div><div class="code">AKT-05</div></div>
    <div class="cell"><div class="seat"></div><div class="burst">150</div><div class="code">AKT-09</div></div>
  </div>
</body>
</html>
