<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pespunte</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #F6F5F2; color: #141414; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative; }
  nav { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { width: 88px; height: 40px; border-radius: 4px; background: #000; display: grid; place-items: center; color: #fff; font: italic 900 12px Arial; white-space: nowrap; }
  .logo b { color: #C8102E; }
  .menu { font: 600 15px/1 "Segoe UI", Arial; }
  h1 { padding: 4px 16px 16px; font: 800 28px/1.06 "Segoe UI", Arial; letter-spacing: -0.02em; }
  .panel { position: relative; margin: 0 16px; height: 420px; border-radius: 14px; background: #1E1E1E; overflow: hidden; }
  .panel svg { position: absolute; inset: 0; }
  .panel::after { content: ""; position: absolute; inset: 8px; border-radius: 9px; border: 2px dashed #C8102E; pointer-events: none; }
  .ph { position: absolute; left: 40px; right: 40px; top: 40px; bottom: 40px; border-radius: 6px; background: linear-gradient(#615850, #2b2824); }
  .ph i { position: absolute; left: 50%; top: 22px; width: 112px; height: 290px; transform: translateX(-50%); border-radius: 54px 54px 36px 36px; background: #161616; }
  .ph i::before { content: ""; position: absolute; inset: 40px 20px; border-radius: 26px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .seam { margin: 22px 0 0; height: 10px; border-top: 2px dashed #C8102E; border-bottom: 2px dashed #C8102E; }
  .row { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 0; }
  .row p { font: 600 16px/1.2 "Segoe UI", Arial; }
  .row p small { display: block; font-size: 13px; color: #5d5a55; font-weight: 400; margin-top: 2px; }
  .row strong { font: 800 28px/1 "Segoe UI", Arial; font-variant-numeric: tabular-nums; }
  .cta { position: absolute; left: 16px; right: 16px; top: 686px; height: 56px; border-radius: 10px; background: #C8102E; color: #fff; display: grid; place-items: center; font: 700 18px/1 "Segoe UI", Arial; }
</style>
</head>
<body>
  <nav><div class="logo">Moto<b>Smart</b></div><span class="menu">Menú</span></nav>
  <h1>Tapicería de moto, cosida a mano en Medellín</h1>
  <div class="panel">
    <svg width="358" height="420" aria-hidden="true">
      <defs>
        <pattern id="hex" width="36" height="62.35" patternUnits="userSpaceOnUse">
          <path d="M18 0 L36 10.39 L36 31.18 L18 41.57 L0 31.18 L0 10.39 Z M18 41.57 L18 62.35 M0 31.18 L0 52 M36 31.18 L36 52" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 3"/>
        </pattern>
      </defs>
      <rect width="358" height="420" fill="url(#hex)"/>
    </svg>
    <div class="ph"><i></i></div>
  </div>
  <div class="seam"></div>
  <div class="row"><p>Yamaha DT 125<small>Trabajo de la semana · diamante rojo</small></p><strong>$145.000</strong></div>
  <div class="cta">Cotizar por WhatsApp</div>
</body>
</html>
