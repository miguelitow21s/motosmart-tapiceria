<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Silleta</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #F4EEE2; color: #23262B; font-family: Georgia, "Segoe UI", serif; position: relative; }
  .corner { position: absolute; width: 150px; height: 150px; }
  .corner i { position: absolute; border-radius: 50%; }
  .tl { left: -30px; top: 40px; } .tr { right: -30px; top: 40px; transform: scaleX(-1); }
  .bl { left: -30px; bottom: 100px; transform: scaleY(-1); } .br { right: -30px; bottom: 100px; transform: scale(-1, -1); }
  .corner i:nth-child(1) { left: 20px; top: 10px; width: 54px; height: 54px; background: radial-gradient(circle, #23262B 0 7px, #C8102E 8px 100%); }
  .corner i:nth-child(2) { left: 70px; top: 56px; width: 40px; height: 40px; background: radial-gradient(circle, #F4EEE2 0 5px, #C8102E 6px 100%); }
  .corner i:nth-child(3) { left: 10px; top: 76px; width: 34px; height: 34px; background: radial-gradient(circle, #C8102E 0 5px, #23262B 6px 100%); }
  .corner b { position: absolute; left: 44px; top: 40px; width: 90px; height: 90px; border: 3px solid #23262B; border-color: #23262B transparent transparent transparent; border-radius: 50%; transform: rotate(40deg); }
  header { position: relative; height: 64px; display: flex; align-items: center; justify-content: center; }
  .logo { width: 84px; height: 40px; border-radius: 6px; background: #000; display: grid; place-items: center; color: #fff; font: italic 900 12px Arial; }
  .logo b { color: #C8102E; }
  .clearing { position: absolute; left: 58px; right: 58px; top: 120px; text-align: center; }
  h1 { font: italic 700 30px/1.05 Georgia, serif; letter-spacing: -0.01em; }
  h1 em { color: #C8102E; }
  .ph { margin: 18px auto 0; width: 210px; height: 300px; border-radius: 105px 105px 6px 6px; background: linear-gradient(#5a524a, #3b3631); position: relative; overflow: hidden; border: 3px solid #23262B; }
  .ph i { position: absolute; left: 50%; top: 30px; width: 100px; height: 240px; transform: translateX(-50%); border-radius: 50px 50px 32px 32px; background: #161616; }
  .ph i::before { content: ""; position: absolute; inset: 36px 18px; border-radius: 26px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .meta { margin-top: 12px; font: 600 24px/1 "Segoe UI", Arial; font-variant-numeric: tabular-nums; }
  .cta { position: absolute; left: 58px; right: 58px; bottom: 120px; height: 56px; border-radius: 28px; background: #C8102E; color: #fff; display: grid; place-items: center; font: 700 22px/1 "Segoe UI", Arial; }
</style>
</head>
<body>
  <div class="corner tl"><i></i><i></i><i></i><b></b></div>
  <div class="corner tr"><i></i><i></i><i></i><b></b></div>
  <div class="corner bl"><i></i><i></i><i></i><b></b></div>
  <div class="corner br"><i></i><i></i><i></i><b></b></div>
  <header><div class="logo">Moto<b>Smart</b></div></header>
  <div class="clearing">
    <h1>Sillas hechas a mano en <em>Medellín</em></h1>
    <div class="ph"><i></i></div>
    <p class="meta">DT 125 · $145.000</p>
  </div>
  <div class="cta">Cotizar</div>
</body>
</html>
