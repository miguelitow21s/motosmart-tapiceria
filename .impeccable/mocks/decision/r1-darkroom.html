<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cuarto oscuro</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; color: #F4F1EA; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative;
    background: radial-gradient(ellipse at 50% 18%, #A3121A 0%, #5E0B0E 55%, #2a0507 100%); }
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { width: 84px; height: 40px; border-radius: 6px; background: #000; display: grid; place-items: center; font: italic 900 12px Arial; }
  .logo b { color: #ff3b46; }
  .timer { font: 700 24px/1 Consolas, monospace; letter-spacing: 0.08em; color: #ffb3b3; }
  h1 { padding: 8px 16px 0; font: 800 30px/1.05 "Segoe UI", Arial; letter-spacing: -0.02em; }
  .line { position: absolute; left: -10px; right: -10px; top: 190px; height: 2px; background: #1a0304; transform: rotate(-2deg); }
  .print { position: absolute; background: #F4F1EA; padding: 8px 8px 34px; color: #151515; }
  .print::before { content: ""; position: absolute; left: 50%; top: -14px; width: 12px; height: 26px; margin-left: -6px; background: #c9b48a; border-radius: 2px; }
  .print .ph { background: linear-gradient(#5a524a, #3b3631); position: relative; height: 100%; }
  .print .ph i { position: absolute; left: 50%; top: 12%; width: 46%; height: 76%; transform: translateX(-50%); border-radius: 40% 40% 30% 30%; background: #161616; }
  .print .ph i::before { content: ""; position: absolute; inset: 16% 18%; border-radius: 30px; background: repeating-linear-gradient(45deg, #2f5fb0 0 8px, #24498a 8px 16px); }
  .print.a { left: 6px; top: 200px; width: 104px; height: 170px; transform: rotate(-5deg); }
  .print.b { left: 112px; top: 196px; width: 166px; height: 300px; transform: rotate(1deg); }
  .print.c { right: 6px; top: 204px; width: 104px; height: 170px; transform: rotate(4deg); }
  .print.b .ph i::before { background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .note { position: absolute; left: 10px; right: 8px; bottom: 6px; font: 600 13px "Segoe Print", cursive; }
  .print.b .note { font-size: 22px; bottom: 2px; }
  .strip { position: absolute; left: 16px; right: 16px; bottom: 108px; display: grid; grid-template-columns: repeat(3, 1fr); height: 40px; }
  .strip span { display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .strip span:nth-child(1) { background: #3a0608; } .strip span:nth-child(2) { background: #7d0f14; } .strip span:nth-child(3) { background: #F4F1EA; color: #5E0B0E; }
  .cta { position: absolute; left: 16px; right: 16px; bottom: 32px; height: 56px; border-radius: 4px; background: #F4F1EA; color: #5E0B0E; display: grid; place-items: center; font: 800 22px/1 "Segoe UI", Arial; }
</style>
</head>
<body>
  <header><div class="logo">Moto<b>Smart</b></div><span class="timer">00:45</span></header>
  <h1>Trabajos recién revelados</h1>
  <div class="line"></div>
  <div class="print a"><div class="ph"><i></i></div><p class="note">AX-100 · 110</p></div>
  <div class="print b"><div class="ph"><i></i></div><p class="note">DT 125 · $145.000</p></div>
  <div class="print c"><div class="ph"><i></i></div><p class="note">CRF · 148</p></div>
  <div class="strip"><span>Elige</span><span>Mira</span><span>Cotiza</span></div>
  <div class="cta">Cotizar esta copia</div>
</body>
</html>
