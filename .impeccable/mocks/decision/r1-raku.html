<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Hollín y brasa</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; color: #F4F3F0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.035) 0 1px, transparent 1.5px) 0 0 / 7px 7px,
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.025) 0 1px, transparent 1.5px) 0 0 / 11px 11px,
      #121110; }
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { width: 84px; height: 40px; border-radius: 6px; background: #000; display: grid; place-items: center; font: italic 900 12px Arial; border: 1px solid #2a2826; }
  .logo b { color: #D0021B; }
  .menu { width: 44px; height: 44px; border: 1px solid #3a3734; border-radius: 6px; }
  .chalk { position: absolute; left: 18px; top: 86px; font: 400 34px/1 "Segoe Print", "Bradley Hand", cursive; color: #E9E6DF; transform: rotate(-4deg); letter-spacing: 0.01em; }
  .chalk u { text-decoration: none; border-bottom: 3px solid #D0021B; }
  .logs { position: absolute; left: 16px; top: 190px; display: flex; flex-direction: column; gap: 6px; }
  .logs span { display: block; height: 30px; padding: 0 10px; border-radius: 15px 4px 4px 15px; background: #2a2724; color: #9d9891; font-size: 13px; line-height: 30px; width: 104px; }
  .logs span.on { background: #D0021B; color: #fff; width: 118px; }
  .panel { position: absolute; right: 0; top: 168px; width: 236px; height: 420px; padding: 10px 0 10px 10px; border-radius: 4px 0 0 4px;
    background:
      conic-gradient(from 30deg at 50% 50%, transparent 0 60deg, rgba(0,0,0,0.07) 60deg 120deg, transparent 120deg) 0 0 / 22px 19px,
      #D9D7D2; }
  .shot { height: 100%; position: relative; background: linear-gradient(#5a524a, #3b3631); overflow: hidden; }
  .seat { position: absolute; left: 50%; top: 40px; width: 120px; height: 300px; transform: translateX(-50%) rotate(-6deg); border-radius: 60px 60px 40px 40px; background: #161616; }
  .seat::before { content: ""; position: absolute; inset: 44px 20px; border-radius: 30px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .price { position: absolute; left: 16px; top: 610px; }
  .price span { display: block; font-size: 15px; color: #9d9891; }
  .price strong { font: 700 38px/1.1 "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .cta { position: absolute; left: 16px; right: 16px; bottom: 32px; height: 56px; border-radius: 4px; background: #D0021B; color: #fff; display: grid; place-items: center; font: 700 22px/1 "Segoe UI", Arial; }
</style>
</head>
<body>
  <header><div class="logo">Moto<b>Smart</b></div><div class="menu"></div></header>
  <p class="chalk">recién <u>hecha</u></p>
  <nav class="logs"><span>Tu moto</span><span class="on">Diseño</span><span>Precio</span><span>Cotiza</span></nav>
  <div class="panel"><div class="shot"><div class="seat"></div></div></div>
  <div class="price"><span>Yamaha DT 125 · cuerina diamante</span><strong>$145.000</strong></div>
  <div class="cta">Cotizar esta silla</div>
</body>
</html>
