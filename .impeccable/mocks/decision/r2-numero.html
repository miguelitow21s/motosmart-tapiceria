<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Número de carrera</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #fff; color: #141414; font-family: "Segoe UI", Helvetica, Arial, sans-serif; position: relative; }
  .stripe { position: absolute; left: -60px; right: -60px; top: 92px; height: 150px; background: #D0021B; transform: skewY(-9deg); }
  .stripe::after { content: ""; position: absolute; left: 0; right: 0; bottom: -18px; height: 10px; background: #141414; }
  nav { position: relative; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .logo { width: 84px; height: 40px; border-radius: 4px; background: #000; display: grid; place-items: center; color: #fff; font: italic 900 12px Arial; }
  .logo b { color: #D0021B; }
  .menu { width: 44px; height: 44px; border-radius: 4px; border: 2px solid #141414; }
  h1 { position: relative; padding: 34px 16px 0; color: #fff; font: italic 800 38px/0.98 "Bahnschrift", "Arial Narrow", Arial, sans-serif; font-stretch: condensed; text-transform: uppercase; letter-spacing: -0.01em; }
  .work { position: relative; margin: 40px 16px 0; height: 270px; display: grid; grid-template-columns: 1fr 140px; gap: 12px; }
  .ph { background: linear-gradient(#5a524a, #2c2925); clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); position: relative; }
  .ph i { position: absolute; left: 50%; top: 22px; width: 96px; height: 224px; transform: translateX(-50%); border-radius: 46px 46px 30px 30px; background: #161616; }
  .ph i::before { content: ""; position: absolute; inset: 34px 16px; border-radius: 22px; background: repeating-linear-gradient(45deg, #b0101c 0 10px, #8f0b16 10px 20px); }
  .spec { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
  .spec small { font: italic 700 13px/1.2 "Bahnschrift", Arial; text-transform: uppercase; color: #5a5a5a; }
  .spec strong { font: italic 800 28px/1 "Bahnschrift", Arial; font-variant-numeric: tabular-nums; }
  .plates { position: relative; margin: 22px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .plate { height: 64px; border-radius: 10px; border: 2.5px solid #141414; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font: italic 800 15px/1 "Bahnschrift", Arial; text-transform: uppercase; }
  .plate span { font-size: 11px; color: #D0021B; margin-bottom: 4px; }
  .plate.on { background: #141414; color: #fff; }
  .cta { position: absolute; left: 16px; right: 16px; bottom: 24px; height: 56px; border-radius: 4px; background: #D0021B; color: #fff; display: grid; place-items: center; font: italic 800 19px/1 "Bahnschrift", Arial; text-transform: uppercase; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <nav><div class="logo">Moto<b>Smart</b></div><div class="menu"></div></nav>
  <h1>Sillas a medida<br>para tu moto</h1>
  <div class="work"><div class="ph"><i></i></div><div class="spec"><small>Yamaha DT 125<br>Diamante rojo</small><strong>$145.000</strong></div></div>
  <div class="plates">
    <div class="plate on"><span>01</span>AKT</div><div class="plate"><span>02</span>Honda</div><div class="plate"><span>03</span>Yamaha</div>
    <div class="plate"><span>04</span>Suzuki</div><div class="plate"><span>05</span>Kawasaki</div><div class="plate"><span>06</span>Auteco</div>
  </div>
  <div class="cta">Cotizar por WhatsApp</div>
</body>
</html>
